function tripRows(){const all=state.data.players.filter(p=>state.data.scores.filter(s=>playerName(s)===val(p,F.pName)).length>=4);return all.map(p=>{const name=val(p,F.pName), rs=state.data.scores.filter(s=>playerName(s)===name);return {id:p.id,fields:{[F.player]:name,[F.hcp]:val(rs.at(-1),F.hcp),[F.thru]:rs.filter(r=>num(r,F.thru)>=18).length,[F.thru+'x']:rs.reduce((a,r)=>a+num(r,F.thru),0),['Net To Par']:rs.reduce((a,r)=>a+num(r,'Net To Par'),0),Gross:rs.reduce((a,r)=>a+num(r,'Gross'),0),Net:rs.reduce((a,r)=>a+num(r,'Net'),0)}}});}
function leaderRow(r,i,round){const open=state.expanded===r.id;return `<article class="leader-row"><div class="rank">${i+1}.</div><div class="leader-name"><button data-expand="${r.id}">${esc(playerName(r))}</button><small>HCP ${num(r,F.hcp)||'—'}</small></div><div class="leader-num">${num(r,'Net')||'—'}</div><div class="leader-to">${toPar(num(r,'Net To Par'))}</div><div class="thru">${round?(num(r,F.thru)>=18?'F':num(r,F.thru)||'–'):(num(r,F.thru)>=4?'F':'R'+num(r,F.thru))}</div>${open?(round?inlineCard(r):tripCard(r)):''}</article>`;}
function inlineCard(r){const holes=state.data.holes.filter(h=>num(h,F.holeRound)===state.round);return `<div class="card-wrap"><div class="mini-card">${[1,10].map(start=>`<div class="mini-grid"><div class="head">${start===1?'Front':'Back'}</div>${Array.from({length:9},(_,i)=>`<div class="head">${start+i}</div>`).join('')}<div class="head">${start===1?'Out':'In'}</div><div class="row-label">Hdcp</div>${Array.from({length:9},(_,i)=>`<div>${num(holes.find(h=>num(h,F.hole)===start+i)||{},F.si)||'—'}</div>`).join('')}<div>—</div><div class="row-label">Par</div>${Array.from({length:9},(_,i)=>`<div>${holePar(holes,start+i)}</div>`).join('')}<div>${Array.from({length:9},(_,i)=>holePar(holes,start+i)).reduce((a,b)=>a+b,0)}</div><div class="row-label">Score</div>${Array.from({length:9},(_,i)=>`<div>${scoreMark(scoreOf(r,start+i),holePar(holes,start+i),netOf(r,start+i))}</div>`).join('')}<div>${Array.from({length:9},(_,i)=>scoreOf(r,start+i)).reduce((a,b)=>a+b,0)||'—'}</div><div class="row-label">Net</div>${Array.from({length:9},(_,i)=>`<div>${netOf(r,start+i)||'—'}</div>`).join('')}<div>—</div></div>`).join('')}<div class="card-footer"><span>Par ${num(courseFor(state.round),F.par)||72}</span><span>Score ${num(r,'Gross')||'—'} / ${num(r,'Net')||'—'}</span><span>Position ${iPosition(r)}</span><button data-player="${esc(playerName(r))}">View player</button></div></div></div>`;}
function iPosition(r){return state.data.scores.filter(x=>num(x,F.round)===state.round).sort((a,b)=>num(a,'Net To Par')-num(b,'Net To Par')).findIndex(x=>x.id===r.id)+1||'—';}
function tripCard(r){return `<div class="card-wrap"><div class="panel" style="margin:8px 0"><strong>Trip rounds</strong><div class="stats">${[1,2,3,4].map(n=>{const x=state.data.scores.find(s=>playerName(s)===playerName(r)&&num(s,F.round)===n);return `<div class="stat"><small>Round ${n}</small><b>${x?`${num(x,'Net')||'—'} · ${toPar(num(x,'Net To Par'))}`:'Did not play'}</b></div>`}).join('')}</div></div></div>`;}
function renderSkins(){const rows=scoresFor(), holes=state.data.holes.filter(h=>num(h,F.holeRound)===state.round),c=courseFor(state.round);return `<header class="topbar"><div class="topbar-inner"><h1>Skins<small>Round ${state.round} · ${esc(c[F.course]||'Course')}</small></h1></div></header><main class="page">${roundPicker()}<div class="panel"><strong>${esc(c[F.skinResults]||'Skins are settled hole by hole')}</strong></div><section>${Array.from({length:18},(_,i)=>{const h=i+1,posted=rows.every(r=>scoreOf(r,h)>0),w=rows.filter(r=>(val(r,F.skinHoles)||'').split(/[, ]+/).includes(String(h)));return `<div class="skin-row"><strong>${h}</strong><span>Par ${holePar(holes,h)}</span><span class="${!posted?'status-pending':w.length?'status-won':'status-tied'}">${!posted?'Pending':w.length?`${esc(playerName(w[0]))} · net ${netOf(w[0],h)||'—'}`:'Tied'}</span></div>`}).join('')}</section><section class="panel"><h3>Trip skins</h3>${state.data.players.sort((a,b)=>num(b,F.totalSkins)-num(a,F.totalSkins)).map(p=>`<div class="player-row"><strong>${esc(val(p,F.pName))}</strong><b>${num(p,F.totalSkins)}</b></div>`).join('')}</section></main>`;}
function renderPlayers(){const players=[...state.data.players].sort((a,b)=>String(val(a,F.pName)).localeCompare(String(val(b,F.pName))));if(state.player)return renderPlayer(players.find(p=>val(p,F.pName)===state.player)||players[0]);return `<header class="topbar"><div class="topbar-inner"><h1>Players<small>All trip golfers</small></h1></div></header><main class="page"><section class="panel"><h3>Player picker</h3>${players.map(p=>`<div class="player-row"><button data-player="${esc(val(p,F.pName))}">${esc(val(p,F.pName))}</button><span class="muted">HI ${val(p,F.pHcp)||'—'}</span></div>`).join('')}</section></main>`;}
function renderPlayer(p){const name=val(p,F.pName),rs=state.data.scores.filter(s=>playerName(s)===name);return `<header class="topbar"><div class="topbar-inner"><button class="icon" data-action="back-players">‹</button><h1>${esc(name)}<small>Player summary</small></h1></div></header><main class="page"><section class="hero"><div class="eyebrow" style="color:#b9f2d0">HANDICAP INDEX ${esc(val(p,F.pHcp)||'—')}</div><h2>${esc(name)}</h2><p>Total skins ${num(p,F.totalSkins)} · ${rs.length>=4?'Trip ranked':'Not ranked — '+rs.length+' rounds'}</p></section>${[1,2,3,4].map(n=>{const r=rs.find(x=>num(x,F.round)===n),c=courseFor(n);return `<article class="round-card" data-player-round="${n}"><header><button>${esc(c[F.course]||`Round ${n}`)}</button><span>${r?(num(r,F.thru)>=18?'F':`Thru ${num(r,F.thru)}`):'Did not play'}</span></header><div class="stats">${r?`<div class="stat"><small>HCP</small><b>${num(r,F.hcp)}</b></div><div class="stat"><small>Gross / Net</small><b>${num(r,'Gross')||'—'} / ${num(r,'Net')||'—'}</b></div><div class="stat"><small>Net to par</small><b>${toPar(num(r,'Net To Par'))}</b></div><div class="stat"><small>Skins</small><b>${num(r,F.skins)} · ${esc(val(r,F.skinHoles)||'—')}</b></div>`:'<span class="muted">Not started</span>'}</div>${state.expanded===r?.id?playerHoles(r):''}</article>`}).join('')}</main>`;}
function playerHoles(r){const holes=state.data.holes.filter(h=>num(h,F.holeRound)===num(r,F.round));return `<div class="holes"><table><tr><th>Hole</th>${Array.from({length:18},(_,i)=>`<th>${i+1}</th>`).join('')}<th>Total</th></tr><tr><td>Par</td>${holes.map(h=>`<td>${num(h,F.holePar)||4}</td>`).join('')}<td>${holes.reduce((a,h)=>a+num(h,F.holePar),0)}</td></tr><tr><td>Hdcp</td>${holes.map(h=>`<td>${num(h,F.si)||'—'}</td>`).join('')}<td>—</td></tr><tr><td>Gross</td>${Array.from({length:18},(_,i)=>`<td>${scoreMark(scoreOf(r,i+1),holePar(holes,i+1),netOf(r,i+1))||'—'}</td>`).join('')}<td>${num(r,'Gross')||'—'}</td></tr><tr><td>Net</td>${Array.from({length:18},(_,i)=>`<td>${netOf(r,i+1)||'—'}</td>`).join('')}<td>${num(r,'Net')||'—'}</td></tr></table></div>`;}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>{state.round=+b.dataset.round;state.group=Number(localStorage.getItem('pinehurst-group-'+state.round))||1;render()});document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{state.group=+b.dataset.group;localStorage.setItem('pinehurst-group-'+state.round,state.group);render()});document.querySelectorAll('[data-hole]').forEach(b=>b.onclick=()=>{state.hole=+b.dataset.hole;render()});document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>openSheet(b.dataset.score));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.expanded=null;render()});document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{state.expanded=state.expanded===b.dataset.expand?null:b.dataset.expand;render()});document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{state.player=b.dataset.player;state.view='players';render()});document.querySelectorAll('[data-player-round]').forEach(b=>b.onclick=()=>{const r=state.data.scores.find(x=>playerName(x)===state.player&&num(x,F.round)===+b.dataset.playerRound);if(r){state.expanded=state.expanded===r.id?null:r.id;render()}});const connect=$('#connect');if(connect)connect.onclick=connectTrip;const next=document.querySelector('[data-action="next-hole"]');if(next)next.onclick=()=>{state.hole=Math.min(18,state.hole+1);render()};const back=document.querySelector('[data-action="back-players"]');if(back)back.onclick=()=>{state.player=null;render()};const settings=document.querySelector('[data-action="settings"]');if(settings)settings.onclick=()=>{if(confirm('Clear the saved trip code on this device?')){localStorage.removeItem('pinehurst-token');state.token=null;render()}};}
function openSheet(id){const r=state.data.scores.find(x=>x.id===id);if(!r)return;const holes=state.data.holes.filter(h=>num(h,F.holeRound)===state.round),par=holePar(holes,state.hole);document.body.insertAdjacentHTML('beforeend',`<div class="sheet-backdrop" id="sheet"><section class="sheet"><h3>${esc(playerName(r))} · Hole ${state.hole}</h3><p class="muted">Par ${par} · HCP ${num(r,F.hcp)||'—'}</p><div class="number-grid">${Array.from({length:10},(_,i)=>i+1).map(n=>`<button class="${n===par?'par':''}" data-pick="${n}">${n}</button>`).join('')}</div><div class="sheet-actions"><button data-pick="more">More 11–15</button><button data-pick="clear">Clear</button><button data-pick="cancel">Cancel</button></div></section></div>`);document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(b.dataset.pick==='cancel')return closeSheet();if(b.dataset.pick==='more')return moreSheet(r);writeScore(r.id,state.hole,b.dataset.pick==='clear'?null:+b.dataset.pick);closeSheet()});}
function moreSheet(r){const sh=$('#sheet .number-grid');sh.innerHTML=Array.from({length:5},(_,i)=>`<button data-pick="${i+11}">${i+11}</button>`).join('');document.querySelectorAll('#sheet [data-pick]').forEach(b=>b.onclick=()=>{writeScore(r.id,state.hole,+b.dataset.pick);closeSheet()});}
function closeSheet(){$('#sheet')?.remove()}
async function writeScore(id,hole,score){const r=state.data.scores.find(x=>x.id===id);if(!r||num(r,F.round)!==state.round||num(r,F.group)!==state.group||hole<1||hole>18||score!==null&&(score<1||score>15))return;const item={id,hole,score};state.queue=state.queue.filter(q=>!(q.id===id&&q.hole===hole));state.queue.push(item);saveQueue();r.fields[holeFields[hole-1]]=score;render();await flushQueue();}
function saveQueue(){localStorage.setItem('pinehurst-queue',JSON.stringify(state.queue))}
async function flushQueue(){if(!state.token||!state.queue.length)return;const pending=[...state.queue];for(const q of pending){try{await api('PATCH',TABLE.scores+'/'+q.id,{fields:{[holeFields[q.hole-1]]:q.score}});state.queue=state.queue.filter(x=>x!==q);saveQueue()}catch(e){break}}render();}
async function api(method,path,body){let res;try{res=await fetch(API+state.base+'/'+path,{method,headers:{Authorization:'Bearer '+state.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}catch(e){throw new Error('Network or browser access error. Check your connection and whether Airtable requests are blocked.')}if(!res.ok){let detail='';try{const payload=await res.json();detail=payload?.error?.message||payload?.error?.type||''}catch(e){}const error=new Error(`Airtable ${res.status}${detail?`: ${detail}`:''}`);error.status=res.status;throw error}return res.json();}
async function list(table,formula){let out=[],offset;do{const q=new URLSearchParams({returnFieldsByFieldId:'true',pageSize:'100'});if(formula)q.set('filterByFormula',formula);if(offset)q.set('offset',offset);const data=await api('GET',TABLE[table]+'?'+q);out.push(...data.records);offset=data.offset}while(offset);return out;}
async function load(){try{const [players,courses,holes,scores]=await Promise.all([list('players'),list('courses'),list('holes'),list('scores')]);state.data={players,courses,holes,scores};const today=new Date().toISOString().slice(0,10);const ordered=courses.sort((a,b)=>num(a,F.courseRound)-num(b,F.courseRound));state.round=(ordered.find(c=>val(c,F.date)>=today)||ordered.at(-1))?.[F.courseRound]||1;state.group=Number(localStorage.getItem('pinehurst-group-'+state.round))||1;state.updated=Date.now();render();await flushQueue()}catch(e){root.innerHTML=`<main class="token-screen"><section class="token-box"><h1>Could not load the trip</h1><p class="error">${esc(e.message.includes('401')?'That trip code was not accepted.':e.message)}</p><button class="primary" data-action="retry">Try again</button></section></main>`;$('#retry')?.addEventListener('click',load)}}
async function connectTrip(){const input=$('#token'),err=$('#token-error');if(!input.value.trim())return;state.token=input.value.trim();err.hidden=true;try{await api('GET',TABLE.courses+'?'+new URLSearchParams({returnFieldsByFieldId:'true',pageSize:'1'}));localStorage.setItem('pinehurst-token',state.token);await load()}catch(e){state.token=null;err.hidden=false;err.textContent=e.status===401?'Airtable rejected this token (401). Check that it is active and copied completely.':e.status===403?'The token is valid but does not have access to this Airtable base (403).':e.status===404?'The base or Courses table was not found (404). Check the app URL and base ID.':e.message}}
function poll(){if(document.hidden||!state.token)return;load()}window.addEventListener('focus',poll);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});setInterval(poll,15000);render();if(state.token)load();
</script></body></html>
