const scoreGross=r=>Number(formulaValue(r,['Gross','Gross Score']))||0;
const scoreNet=r=>Number(formulaValue(r,['Net','Net Score']))||0;
const scoreToPar=r=>Number(formulaValue(r,['Net To Par','Net to Par','To Par']))||0;
const scoreGrossToPar=r=>Number(formulaValue(r,['To Par','Gross To Par','Gross to Par']))||0;
const scoreThru=r=>num(r,F.thru)||Number(formulaValue(r,['Thru']))||0;
function fmtDate(v){if(!v)return 'Date TBD';const d=new Date(v+'T12:00:00');return isNaN(d)?v:d.toLocaleDateString(undefined,{weekday:'short',month:'numeric',day:'numeric'});}
function toPar(n){n=Number(n)||0;return n<0?`<span class="under">${n}</span>`:n>0?`<span class="over">+${n}</span>`:'<span> E</span>';}
function playerName(r){const p=val(r,F.player);return typeof p==='object'?p.name:(p||'Unknown player');}
function playerImage(r){const image=r?.fields?.Image||r?.fields?.image;const attachment=Array.isArray(image)?image[0]:image;return attachment?.thumbnails?.small?.url||attachment?.thumbnails?.large?.url||attachment?.url||'';}
function fieldByName(fields,name){const wanted=name.trim().toLowerCase().replace(/[^a-z0-9]/g,'');const key=Object.keys(fields||{}).find(candidate=>candidate.trim().toLowerCase().replace(/[^a-z0-9]/g,'')===wanted);return key===undefined?undefined:fields[key];}
function fieldByPattern(fields,pattern){const key=Object.keys(fields||{}).find(candidate=>{const normalized=candidate.trim().toLowerCase().replace(/[^a-z0-9]/g,'');return !normalized.startsWith('fld')&&normalized.includes(pattern)});return key===undefined?undefined:fields[key];}

function courseField(record,id,name,def=''){const value=val(record,id);return value!==''&&value!==null&&value!==undefined?value:(fieldByName(record?.fields,name)??def);}
function normalizeCourses(records,namedRecords){const namedById=new Map(namedRecords.map(r=>[r.id,r]));const aliases=[[F.courseRound,['Round','Round Number'],'round'],[F.course,['Course','Course Name','Course Name (Course)'],'course'],[F.date,['Date','Round Date'],'date'],[F.tee,['Tee Time','Tee'],'tee'],[F.par,['Par','Course Par'],'par'],[F.skinResults,['Skins Results','Skin Results'],'skins']];return records.map(record=>{const fields={...record.fields,...(namedById.get(record.id)?.fields||{})};for(const [id,names,pattern] of aliases){if(fields[id]===undefined||fields[id]===null||fields[id]===''){const namedValue=names.map(name=>fieldByName(fields,name)).find(value=>value!==undefined)??fieldByPattern(fields,pattern);if(namedValue!==undefined)fields[id]=namedValue}}return {...record,fields}});}
function normalizeHoles(records,namedRecords){const namedById=new Map(namedRecords.map(r=>[r.id,r]));const aliases=[[F.holeRound,['Round','Round Number'],'round'],[F.hole,['Hole','Hole Number'],'hole'],[F.si,['Stroke Index','Strokes','SI'],'strokeindex'],[F.holePar,['Par','Hole Par'],'par']];return records.map(record=>{const fields={...record.fields,...(namedById.get(record.id)?.fields||{})};for(const [id,names,pattern] of aliases){if(fields[id]===undefined||fields[id]===null||fields[id]===''){const namedValue=names.map(name=>fieldByName(fields,name)).find(value=>value!==undefined)??fieldByPattern(fields,pattern);if(namedValue!==undefined)fields[id]=namedValue}}return {...record,fields}});}
function scoresFor(round=state.round){return state.data.scores.filter(r=>num(r,F.round)===round);}
function scoreOf(r,h){return num(r,holeFields[h-1]);}

function render(){if(!state.token){renderToken();return}if(!state.data.courses.length){root.innerHTML='<div class="loading">Loading Pinehurst Golf 2026…</div>';return}const views={home:renderHome,score:renderScore,leaderboard:renderLeaderboard,skins:renderSkins,players:renderPlayers};root.innerHTML=views[state.view]();if(state.view!=='score')root.insertAdjacentHTML('beforeend',nav());bind();}
function renderToken(){root.innerHTML=`<main class="token-screen"><section class="token-box"><div class="eyebrow">PINEHURST AREA · SEPT 23–26, 2026</div><h1>Pinehurst Golf 2026</h1><p class="muted">Enter the private trip code Scott sent you. It stays on this device and is never shown after sign-in.</p><input id="token" type="password" autocomplete="off" placeholder="Airtable trip code"><button class="primary" id="connect">Connect to trip</button><p id="token-error" class="tiny error" hidden></p><p class="tiny muted">This app reads and updates the trip's Airtable base directly. Use the dedicated trip token only.</p></section></main>`;bind();}

function scoreShape(gross,par){const grossScore=Number(gross),holeParValue=Number(par);if(!Number.isFinite(grossScore)||!Number.isFinite(holeParValue)||holeParValue<=0)return 'plain';const difference=grossScore-holeParValue;if(difference===-1)return 'birdie';if(difference<=-2)return 'eagle';if(difference===0)return 'plain';if(difference===1)return 'bogey';return 'double-bogey';}

function renderScore(){const rows=scoresFor().filter(r=>num(r,F.group)===state.group), prev=state.hole-1,c=courseFor(state.round), holes=state.data.holes.filter(r=>num(r,F.holeRound)===state.round), par=holePar(holes,state.hole);return `<header class="topbar"><div class="topbar-inner"><button class="icon" data-view="home">‹</button><h1>Round ${state.round} · Net Stroke Play<small>${esc(c[F.course]||'Course')}</small></h1><button class="icon" data-action="fullcard">▦</button></div></header><main class="page"><div class="score-head"><div><div class="label">NET STROKE PLAY</div><small>Group ${state.group}</small></div>${prev>0?`<button class="hole-head" data-hole="${prev}"><strong>${prev}</strong><small>Par ${holePar(holes,prev)}</small></button>`:'<div></div>'}<button class="hole-head current" data-hole="${state.hole}"><strong>${state.hole}</strong><small>Par ${par}</small></button></div>${rows.length?rows.map(r=>scoreRow(r,prev,par)).join(''):'<div class="empty">No Scores rows found for Group '+state.group+'.</div>'}${rows.length&&rows.every(r=>scoreOf(r,state.hole)>0)?`<button class="primary" style="margin-top:13px" data-action="next-hole">Next hole →</button>`:''}</main>`;}
function holeNumber(record){return num(record,F.hole)||Number(fieldByName(record?.fields,'Hole'))||Number(fieldByName(record?.fields,'Hole Number'))||0;}
function holeRound(record){return num(record,F.holeRound)||Number(fieldByName(record?.fields,'Round'))||Number(fieldByName(record?.fields,'Round Number'))||0;}
function actualHolePar(record){return num(record,F.holePar)||Number(fieldByName(record?.fields,'Par'))||Number(fieldByName(record?.fields,'Hole Par'))||0;}
function actualHoleIndex(record){return num(record,F.si)||Number(fieldByName(record?.fields,'Stroke Index'))||Number(fieldByName(record?.fields,'Strokes'))||Number(fieldByName(record?.fields,'SI'))||0;}
function holePar(holes,h,roundOverride){const inferredRound=Number(roundOverride)|| (holes?.length?holeRound(holes[0]):Number(state.round));const source=state.data.holes.filter(record=>holeRound(record)===inferredRound);const hole=source.find(record=>holeNumber(record)===Number(h))||holes?.find(record=>holeNumber(record)===Number(h));return actualHolePar(hole);}
function scoreRow(r,prev,par){const gross=scoreOf(r,state.hole), prevGross=prev>0?scoreOf(r,prev):0, net=netOf(r,state.hole), prevNet=netOf(r,prev);const tp=scoreToPar(r);return `<div class="score-row"><div class="player-name"><strong>${esc(playerName(r))}</strong><small>HCP ${num(r,F.hcp)||'—'}</small><div class="to-par">${toPar(tp)}</div></div><div class="score-cell">${prev>0?`<button class="score-circle ${prevGross?'filled':''}" data-score="${r.id}" data-score-hole="${prev}">${prevGross||''}${prevGross&&prevNet?`<sup>${prevNet}</sup>`:''}${state.queue.some(q=>q.id===r.id&&q.hole===prev)?'<i class="unsynced"></i>':''}</button>`:''}</div><div class="score-cell"><div class="dots">${Array.from({length:strokesOf(r,state.hole)},()=>'<i class="dot"></i>').join('')}</div><button class="score-circle ${gross?'filled':''}" data-score="${r.id}" data-score-hole="${state.hole}">${gross||''}${gross&&net?`<sup>${net}</sup>`:''}${state.queue.some(q=>q.id===r.id&&q.hole===state.hole)?'<i class="unsynced"></i>':''}</button></div></div>`;}
function renderLeaderboard(){const round=state.tab==='round', rows=round?scoresFor():tripRows();const sorted=rows.sort((a,b)=>{const aValue=state.sort==='score'?scoreNet(a):scoreToPar(a),bValue=state.sort==='score'?scoreNet(b):scoreToPar(b);return (aValue-bValue)*state.sortDirection||(scoreThru(b)-scoreThru(a))});return `<header class="topbar"><div class="topbar-inner"><h1>Round ${state.round}<small>${esc(courseFor(state.round)[F.course]||'Course')}</small></h1></div></header><main class="page">${roundPicker()}<div class="segmented"><button class="${round?'active':''}" data-tab="round">Round</button><button class="${!round?'active':''}" data-tab="trip">Trip</button></div><div class="table-header"><span>#</span><span>NAME</span><button data-sort="score">SCORE ${state.sort==='score'?(state.sortDirection===1?'↑':'↓'):''}</button><button data-sort="toPar">TO PAR ${state.sort==='toPar'?(state.sortDirection===1?'↑':'↓'):''}</button><span>THRU</span></div>${sorted.length?sorted.map((r,i)=>leaderRow(r,i,round)).join(''):'<div class="empty">No leaderboard data yet.</div>'}</main>`;}
function tripRows(){const all=state.data.players.filter(p=>state.data.scores.filter(s=>playerName(s)===val(p,F.pName)).length>=4);return all.map(p=>{const name=val(p,F.pName),rs=state.data.scores.filter(s=>playerName(s)===name),grossTotal=rs.reduce((a,r)=>a+scoreGross(r),0),netTotal=rs.reduce((a,r)=>a+scoreNet(r),0),toParTotal=rs.reduce((a,r)=>a+scoreToPar(r),0);return {id:p.id,fields:{[F.player]:name,[F.hcp]:val(rs.at(-1),F.hcp),[F.thru]:rs.filter(r=>scoreThru(r)>=18).length,[F.thru+'x']:rs.reduce((a,r)=>a+scoreThru(r),0),['Net To Par']:toParTotal,['Gross Total']:grossTotal,['Net Total']:netTotal}}});}

function inlineCard(r){const holes=state.data.holes.filter(h=>holeRound(h)===state.round);return `<div class="card-wrap"><div class="mini-card">${[1,10].map(start=>`<div class="mini-grid"><div class="head">${start===1?'Front':'Back'}</div>${Array.from({length:9},(_,i)=>`<div class="head">${start+i}</div>`).join('')}<div class="head">${start===1?'Out':'In'}</div><div class="row-label">Hdcp</div>${Array.from({length:9},(_,i)=>`<div>${actualHoleIndex(holes.find(h=>holeNumber(h)===start+i))||'—'}</div>`).join('')}<div>—</div><div class="row-label">Par</div>${Array.from({length:9},(_,i)=>`<div>${holePar(holes,start+i,state.round)}</div>`).join('')}<div>${Array.from({length:9},(_,i)=>holePar(holes,start+i,state.round)).reduce((a,b)=>a+b,0)}</div><div class="row-label">Score</div>${Array.from({length:9},(_,i)=>`<div>${scoreMark(scoreOf(r,start+i),holePar(holes,start+i,state.round),netOf(r,start+i))}</div>`).join('')}<div>${Array.from({length:9},(_,i)=>scoreOf(r,start+i)).reduce((a,b)=>a+b,0)||'—'}</div><div class="row-label">Net</div>${Array.from({length:9},(_,i)=>`<div>${netOf(r,start+i)||'—'}</div>`).join('')}<div>—</div></div>`).join('')}<div class="card-footer"><span>Par ${num(courseFor(state.round),F.par)||72}</span><span>Score ${num(r,'Gross')||'—'} / ${num(r,'Net')||'—'}</span><span>Position ${iPosition(r)}</span><button data-player="${esc(playerName(r))}">View player</button></div></div></div>`;}

function renderSkins(){const rows=scoresFor(), holes=state.data.holes.filter(h=>num(h,F.holeRound)===state.round),c=courseFor(state.round);return `<header class="topbar"><div class="topbar-inner"><h1>Skins<small>Round ${state.round} · ${esc(c[F.course]||'Course')}</small></h1></div></header><main class="page">${roundPicker()}<div class="panel"><strong>${esc(c[F.skinResults]||'Skins are settled hole by hole')}</strong></div><section>${Array.from({length:18},(_,i)=>{const h=i+1,posted=rows.every(r=>scoreOf(r,h)>0),w=rows.filter(r=>(val(r,F.skinHoles)||'').split(/[, ]+/).includes(String(h)));return `<div class="skin-row"><strong>${h}</strong><span>Par ${holePar(holes,h)}</span><span class="${!posted?'status-pending':w.length?'status-won':'status-tied'}">${!posted?'Pending':w.length?`${esc(playerName(w[0]))} · net ${netOf(w[0],h)||'—'}`:'Tied'}</span></div>`}).join('')}</section><section class="panel"><h3>Trip skins</h3>${state.data.players.sort((a,b)=>num(b,F.totalSkins)-num(a,F.totalSkins)).map(p=>`<div class="player-row"><strong>${esc(val(p,F.pName))}</strong><b>${num(p,F.totalSkins)}</b></div>`).join('')}</section></main>`;}

function renderPlayer(p){const name=val(p,F.pName),rs=state.data.scores.filter(s=>playerName(s)===name);return `<header class="topbar"><div class="topbar-inner"><button class="icon" data-action="back-players">‹</button><h1>${esc(name)}<small>Player summary</small></h1></div></header><main class="page"><section class="hero"><div class="eyebrow" style="color:#b9f2d0">HANDICAP INDEX ${esc(val(p,F.pHcp)||'—')}</div><h2>${esc(name)}</h2><p>Total skins ${num(p,F.totalSkins)} · ${rs.length>=4?'Trip ranked':'Not ranked — '+rs.length+' rounds'}</p></section>${[1,2,3,4].map(n=>{const r=rs.find(x=>num(x,F.round)===n),c=courseFor(n);return `<article class="round-card" data-player-round="${n}"><header><button>${esc(c[F.course]||`Round ${n}`)}</button><span>${r?(num(r,F.thru)>=18?'F':`Thru ${num(r,F.thru)}`):'Did not play'}</span></header><div class="stats">${r?`<div class="stat"><small>HCP</small><b>${num(r,F.hcp)}</b></div><div class="stat"><small>Gross / Net</small><b>${num(r,'Gross')||'—'} / ${num(r,'Net')||'—'}</b></div><div class="stat"><small>Net to par</small><b>${toPar(num(r,'Net To Par'))}</b></div><div class="stat"><small>Skins</small><b>${num(r,F.skins)} · ${esc(val(r,F.skinHoles)||'—')}</b></div>`:'<span class="muted">Not started</span>'}</div>${state.expanded===r?.id?playerHoles(r):''}</article>`}).join('')}</main>`;}
function playerHoles(r){const playerRound=num(r,F.round),holes=state.data.holes.filter(h=>holeRound(h)===playerRound),holeRecords=Array.from({length:18},(_,i)=>holes.find(h=>holeNumber(h)===i+1)),pars=Array.from({length:18},(_,i)=>holePar(holes,i+1,playerRound)),indexes=holeRecords.map(actualHoleIndex);return `<div class="holes"><table><tr><th>Hole</th>${Array.from({length:18},(_,i)=>`<th>${i+1}</th>`).join('')}<th>Total</th></tr><tr><td>Par</td>${pars.map(par=>`<td>${par||'—'}</td>`).join('')}<td>${pars.reduce((a,b)=>a+b,0)||'—'}</td></tr><tr><td>Hdcp</td>${indexes.map(index=>`<td>${index||'—'}</td>`).join('')}<td>—</td></tr><tr><td>Gross</td>${Array.from({length:18},(_,i)=>`<td>${scoreMark(scoreOf(r,i+1),pars[i],netOf(r,i+1))||'—'}</td>`).join('')}<td>${num(r,'Gross')||'—'}</td></tr><tr><td>Net</td>${Array.from({length:18},(_,i)=>`<td>${netOf(r,i+1)||'—'}</td>`).join('')}<td>${num(r,'Net')||'—'}</td></tr></table></div>`;}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelectorAll('[data-round]').forEach(b=>b.onclick=()=>{state.round=+b.dataset.round;state.group=Number(localStorage.getItem('pinehurst-group-'+state.round))||1;render()});document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{state.group=+b.dataset.group;localStorage.setItem('pinehurst-group-'+state.round,state.group);render()});document.querySelectorAll('[data-hole]').forEach(b=>b.onclick=()=>{state.hole=+b.dataset.hole;render()});document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>openSheet(b.dataset.score,+b.dataset.scoreHole));document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{const sort=b.dataset.sort;if(state.sort===sort)state.sortDirection*=-1;else{state.sort=sort;state.sortDirection=1}render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.expanded=null;render()});document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{state.expanded=state.expanded===b.dataset.expand?null:b.dataset.expand;render()});document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{state.player=b.dataset.player;state.view='players';render()});document.querySelectorAll('[data-player-round]').forEach(b=>b.onclick=()=>{const r=state.data.scores.find(x=>playerName(x)===state.player&&num(x,F.round)===+b.dataset.playerRound);if(r){state.expanded=state.expanded===r.id?null:r.id;render()}});const connect=$('#connect');if(connect)connect.onclick=connectTrip;const next=document.querySelector('[data-action="next-hole"]');if(next)next.onclick=()=>{state.hole=Math.min(18,state.hole+1);render()};const back=document.querySelector('[data-action="back-players"]');if(back)back.onclick=()=>{state.player=null;render()};const settings=document.querySelector('[data-action="settings"]');if(settings)settings.onclick=()=>{if(confirm('Clear the saved trip code o rong>${esc(val(p,F.pName))}</strong><b>${num(p,F.totalSkins)}</b></div>`).join('')}</section></main>`;}

function scoreRow(r,holes){const tp=scoreToPar(r),expanded=state.scorecardPlayer===r.id;return `<div class="score-entry-block"><div class="score-row"><div class="player-name"><button class="player-score-toggle player-with-photo" data-score-player="${r.id}">${photoMarkup(state.data.players.find(p=>val(p,F.pName)===playerName(r)))}<span><strong>${esc(playerName(r))}</strong><small>HCP ${num(r,F.hcp)||'—'}</small><span class="score-summary">Gross ${scoreGross(r)||'—'} · Net ${scoreNet(r)||'—'}</span></span></button><div class="to-par">${toPar(tp)}</div></div>${holes.map(h=>{const value=scoreOf(r,h),netValue=netOf(r,h);return `<div class="score-cell"><div class="dots">${Array.from({length:strokesOf(r,h)},()=>'<i class="dot"></i>').join('')}</div><button class="score-circle ${value?'filled':''}" data-score="${r.id}" data-score-hole="${h}">${value||''}${value&&netValue?`<sup>${netValue}</sup>`:''}${state.queue.some(q=>q.id===r.id&&q.hole===h)?'<i class="unsynced"></i>':''}</button></div>`}).join('')}</div>${expanded?`<div class="score-expanded">${playerHoles(r)}</div>`:''}</div>`;}
function leaderRow(r,i,round){const open=state.expanded===r.id,player=state.data.players.find(p=>val(p,F.pName)===playerName(r)),scoreCell=round?`${scoreNet(r)||'—'}`:`${val(r,'Gross Total')||'—'}<small>Net ${val(r,'Net Total')||'—'}</small>`;return `<article class="leader-row"><div class="rank">${i+1}.</div><div class="leader-name"><button class="player-with-photo" data-expand="${r.id}">${photoMarkup(player)}<span><strong>${esc(playerName(r))}</strong><small>HCP ${num(r,F.hcp)||'—'}</small></span></button></div><div class="leader-num">${scoreCell}</div><div class="leader-to">${toPar(scoreToPar(r))}</div><div class="thru">${round?(scoreThru(r)>=18?'F':scoreThru(r)||'–'):(scoreThru(r)>=4?'F':'R'+scoreThru(r))}</div>${open?(round?inlineCard(r):tripCard(r)):''}</article>`;}

const MONEY_CONFIG={1:{net:275,skins:275,payouts:[175,75,25],players:11},2:{net:300,skins:300,payouts:[200,75,25],players:12},3:{net:300,skins:300,payouts:[200,75,25],players:12},4:{net:300,skins:300,payouts:[200,75,25],players:12}};
function moneyCents(value){return Math.round(Number(value)*100);}
function distributeCents(totalCents,weights,names){const totalWeight=weights.reduce((sum,weight)=>sum+weight,0);if(!totalWeight)return weights.map(()=>0);const shares=weights.map(weight=>Math.floor(totalCents*weight/totalWeight)),left=totalCents-shares.reduce((sum,share)=>sum+share,0);names.map((name,index)=>({name,index})).sort((a,b)=>a.name.localeCompare(b.name)||a.index-b.index).slice(0,left).forEach(item=>{shares[item.index]+=1});return shares;}
function calcNetPayouts(rows,config){const eligible=rows.filter(row=>Number.isFinite(Number(row.toPar))).sort((a,b)=>Number(a.toPar)-Number(b.toPar)||String(a.name).localeCompare(String(b.name)));const payouts=[];let index=0,place=1;while(index<eligible.length){const tied=[];const value=Number(eligible[index].toPar);while(index+tied.length<eligible.length&&Number(eligible[index+tied.length].toPar)===value)tied.push(eligible[index+tied.length]);const occupied=Array.from({length:tied.length},(_,offset)=>config.payouts[place-1+offset]||0);const shares=distributeCents(occupied.reduce((sum,payout)=>sum+moneyCents(payout),0),tied.map(()=>1),tied.map(row=>String(row.name)));tied.forEach((row,tieIndex)=>payouts.push({name:row.name,toPar:value,place:tied.length>1?`T${place}`:String(place),amountCents:shares[tieIndex]}));index+=tied.length;place+=tied.length}return payouts;}
function calcSkinsPayouts(rows,config){const eligible=rows.map(row=>({name:String(row.name),skins:Math.max(0,Number(row.skins)||0)})),totalSkins=eligible.reduce((sum,row)=>sum+row.skins,0),potCents=moneyCents(config.skins);if(!totalSkins)return {totalSkins,valuePerSkin:0,refunded:true,refundPerPlayerCents:Math.round(potCents/config.players),payouts:eligible.map(row=>({...row,amountCents:0}))};const shares=distributeCents(potCents,eligible.map(row=>row.skins),eligible.map(row=>row.name));return {totalSkins,valuePerSkin:config.skins/totalSkins,refunded:false,refundPerPlayerCents:0,payouts:eligible.map((row,index)=>({...row,amountCents:shares[index]}))};}
function moneyFormat(cents){return `$${(Number(cents||0)/100).toFixed(2)}`;}
